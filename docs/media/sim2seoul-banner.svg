    <text x="78" y="59" fill="#99bdc2" font-size="12" font-weight="700" letter-spacing="2.3">SPATIAL DATA. PLAYABLE PLACES.</text>
    <text x="52" y="154" fill="#f4f6ec" font-size="76" font-weight="800" letter-spacing="-3.5">Sim<tspan fill="#70e2c3">2</tspan>Seoul</text>
    <text x="57" y="195" fill="#c2d8d6" font-size="21">From spatial data to a walkable Seoul.</text>
    <path d="M57 226H454" stroke="#87b6bb" stroke-opacity=".22"/>
    <text x="57" y="255" fill="#9ab9bc" font-size="11" letter-spacing="1.7">DEOKSUGUNG / CITY HALL / JEONGDONG</text>
    <text x="57" y="295" fill="#6e969f" font-size="10" letter-spacing="1.4">GODOT + PYTHON + GIS</text>
  </g>
