<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Sim2Seoul</title>
  <desc id="desc">From spatial data to a walkable Seoul. Original illustrative skyline of palace roofs, city buildings and a connected walking route; this banner is not a game screenshot.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b2230"/><stop offset="1" stop-color="#102f38"/></linearGradient>
    <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#345762"/><stop offset="1" stop-color="#1a3945"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".035"/></pattern>
    <pattern id="windows" width="17" height="22" patternUnits="userSpaceOnUse"><path d="M3 5H9V17H3Z" fill="#8bb3b5" fill-opacity=".35"/></pattern>
  </defs>
  <rect width="1280" height="340" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="340" rx="20" fill="url(#grid)"/>
  <circle cx="1084" cy="101" r="113" fill="#54dac0" opacity=".045"/>
  <circle cx="1084" cy="101" r="77" fill="none" stroke="#54dac0" stroke-opacity=".10"/>
  <g font-family="Arial, Helvetica, sans-serif">
